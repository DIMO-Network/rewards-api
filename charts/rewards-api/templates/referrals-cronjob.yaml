{{- if .Values.referralsCronJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rewards-api.fullname" . }}-issue-referral-bonus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rewards-api.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.referralsCronJob.schedule | quote}}
  concurrencyPolicy: "Forbid"
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled
          {{- with .Values.podAnnotations }}
            {{- toYaml . | nindent 8 }}
          {{- end }}
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: eks.amazonaws.com/nodegroup
                    operator: In
                    values:
                    - private
          containers:
          - name: weekly-rewards-calculation
            securityContext:
              {{- toYaml .Values.securityContext | nindent 14 }}
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
            command: ['/bin/sh']
            args: ['-c', '/rewards-api issue-referral-bonus; CODE=$?; echo "weekly referrals calculation completed"; exit $CODE;']
            envFrom:
            - configMapRef:
                name: {{ include "rewards-api.fullname" . }}-config
            - secretRef:
                name: {{ include "rewards-api.fullname" . }}-secret
          restartPolicy: OnFailure
{{ end }}          
